# Netlify build configuration.
# Settings here override the corresponding values in the Netlify UI.
# https://docs.netlify.com/build/configure-builds/file-based-configuration/

"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires Node >=22.12.0; "22" resolves to the latest 22.x.
  NODE_VERSION = "22"
