name: Sync Eventbrite

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: America/Mexico_City
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-eventbrite.yml'
      - 'scripts/sync-eventbrite.mjs'
      - 'src/**'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: eventbrite-sync-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  sync:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-eventbrite.mjs
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORGANIZATION_ID: ${{ vars.EVENTBRITE_ORGANIZATION_ID }}
      - name: Commit updated events
        run: |
          git add -- src/content/encuentros/
          if git diff --cached --quiet; then exit 0; fi
          npm run build
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync Eventbrite events'
          git push
